# Replay counterpart for the memory tool seam. It includes cordis.yml directly
# because a config patch cannot target an entry behind a nested include, then
# mounts the log memory provider and its tool while replacing the live model
# with keyless replay. The store lands under the run's isolated $DSH_HOME.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: memory
            name: '@deepseek-ai/dsh-memory-log'
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
